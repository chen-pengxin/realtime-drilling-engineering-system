<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="1390" viewBox="0 0 1500 1390"><defs><marker id="arrow" markerWidth="9" markerHeight="8" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#475569"/></marker></defs><rect width="1500" height="1390" fill="#fff"/>
<rect x="330" y="30" width="440" height="60" rx="7" fill="#f8fafc" stroke="#64748b"/>
<text x="550.0" y="54.5" text-anchor="middle" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="16" fill="#0f172a">进入评价工作区／切换井场／参数变化</text>
<text x="550.0" y="77.5" text-anchor="middle" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="16" fill="#0f172a">页面重新获得焦点或测斜版本更新</text>
<polygon points="550.0,130 760,190.0 550.0,250 340,190.0" fill="#eff6ff" stroke="#64748b"/>
<text x="550.0" y="184.5" text-anchor="middle" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="16" fill="#0f172a">处于评价工作区、有井场和计算权限，</text>
<text x="550.0" y="207.5" text-anchor="middle" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="16" fill="#0f172a">且非游客、无需修改初始密码？</text>
<rect x="920" y="155" width="530" height="70" rx="7" fill="#f8fafc" stroke="#64748b"/>
<text x="1185.0" y="184.5" text-anchor="middle" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="16" fill="#0f172a">不弹窗；离开工作区时关闭旧弹窗</text>
<text x="1185.0" y="207.5" text-anchor="middle" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="16" fill="#0f172a">资料、配置、系统管理、纯预测页面不触发</text>
<rect x="330" y="300" width="440" height="60" rx="7" fill="#f8fafc" stroke="#64748b"/>
<text x="550.0" y="324.5" text-anchor="middle" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="16" fill="#0f172a">读取服务端确认状态</text>
<text x="550.0" y="347.5" text-anchor="middle" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="16" fill="#0f172a">同一用户、井场的并发检查合并排队</text>
<polygon points="550.0,400 760,450.0 550.0,500 340,450.0" fill="#eff6ff" stroke="#64748b"/>
<text x="550.0" y="444.5" text-anchor="middle" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="16" fill="#0f172a">响应仍属于当前用户、井场，</text>
<text x="550.0" y="467.5" text-anchor="middle" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="16" fill="#0f172a">且当前仍处于有效工作区？</text>
<rect x="920" y="415" width="530" height="70" rx="7" fill="#f8fafc" stroke="#64748b"/>
<text x="1185.0" y="444.5" text-anchor="middle" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="16" fill="#0f172a">丢弃旧响应</text>
<text x="1185.0" y="467.5" text-anchor="middle" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="16" fill="#0f172a">不得覆盖新井场状态或重新打开旧弹窗</text>
<polygon points="550.0,550 760,600.0 550.0,650 340,600.0" fill="#eff6ff" stroke="#64748b"/>
<text x="550.0" y="606.0" text-anchor="middle" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="16" fill="#0f172a">确认状态读取成功？</text>
<rect x="920" y="555" width="530" height="90" rx="7" fill="#f8fafc" stroke="#64748b"/>
<text x="1185.0" y="594.5" text-anchor="middle" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="16" fill="#0f172a">显示读取失败与“重新读取”入口，不弹空窗</text>
<text x="1185.0" y="617.5" text-anchor="middle" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="16" fill="#0f172a">重试时重新读取；未经确认的计算仍由后端拦截</text>
<polygon points="550.0,700 760,750.0 550.0,800 340,750.0" fill="#eff6ff" stroke="#64748b"/>
<text x="550.0" y="744.5" text-anchor="middle" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="16" fill="#0f172a">当前登录会话、井场和参数内容</text>
<text x="550.0" y="767.5" text-anchor="middle" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="16" fill="#0f172a">已有确认记录？</text>
<rect x="920" y="715" width="530" height="70" rx="7" fill="#f8fafc" stroke="#64748b"/>
<text x="1185.0" y="744.5" text-anchor="middle" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="16" fill="#0f172a">不弹窗</text>
<text x="1185.0" y="767.5" text-anchor="middle" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="16" fill="#0f172a">允许继续提交评价或再规划任务</text>
<rect x="330" y="850" width="440" height="75" rx="7" fill="#f8fafc" stroke="#64748b"/>
<text x="550.0" y="882.0" text-anchor="middle" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="16" fill="#0f172a">显示参数确认弹窗</text>
<text x="550.0" y="905.0" text-anchor="middle" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="16" fill="#0f172a">K → 不确定性模型与参数 → SF 公式</text>
<polygon points="550.0,975 760,1025.0 550.0,1075 340,1025.0" fill="#eff6ff" stroke="#64748b"/>
<text x="550.0" y="1031.0" text-anchor="middle" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="16" fill="#0f172a">核对后确认，还是修改参数？</text>
<rect x="920" y="975" width="530" height="100" rx="7" fill="#f8fafc" stroke="#64748b"/>
<text x="1185.0" y="1019.5" text-anchor="middle" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="16" fill="#0f172a">进入系统配置修改参数</text>
<text x="1185.0" y="1042.5" text-anchor="middle" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="16" fill="#0f172a">配置页不弹窗；返回评价工作区时重新检查</text>
<rect x="330" y="1125" width="440" height="80" rx="7" fill="#f8fafc" stroke="#64748b"/>
<text x="550.0" y="1159.5" text-anchor="middle" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="16" fill="#0f172a">提交当前参数指纹</text>
<text x="550.0" y="1182.5" text-anchor="middle" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="16" fill="#0f172a">后端检查一致性与参数合法性，不计算轨迹</text>
<rect x="920" y="1125" width="530" height="80" rx="7" fill="#f8fafc" stroke="#64748b"/>
<text x="1185.0" y="1159.5" text-anchor="middle" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="16" fill="#0f172a">参数已变化：重新读取并重新核对</text>
<text x="1185.0" y="1182.5" text-anchor="middle" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="16" fill="#0f172a">其他错误：保留弹窗，允许修改或重试</text>
<rect x="330" y="1270" width="440" height="80" rx="7" fill="#f8fafc" stroke="#64748b"/>
<text x="550.0" y="1304.5" text-anchor="middle" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="16" fill="#0f172a">记录确认并关闭弹窗；无变化则结束</text>
<text x="550.0" y="1327.5" text-anchor="middle" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="16" fill="#0f172a">请求期间发生的变化事件必须补查</text>
<polyline points="550,90 550,130" fill="none" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>
<polyline points="760,190 920,190" fill="none" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="810" y="177" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="14" fill="#334155">否</text>
<polyline points="550,250 550,300" fill="none" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="565" y="280" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="14" fill="#334155">是</text>
<polyline points="550,360 550,400" fill="none" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>
<polyline points="760,450 920,450" fill="none" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="810" y="437" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="14" fill="#334155">否</text>
<polyline points="550,500 550,550" fill="none" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="565" y="530" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="14" fill="#334155">是</text>
<polyline points="760,600 920,600" fill="none" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="810" y="587" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="14" fill="#334155">否</text>
<polyline points="550,650 550,700" fill="none" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="565" y="680" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="14" fill="#334155">是</text>
<polyline points="760,750 920,750" fill="none" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="810" y="737" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="14" fill="#334155">是</text>
<polyline points="550,800 550,850" fill="none" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="565" y="830" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="14" fill="#334155">否</text>
<polyline points="550,925 550,975" fill="none" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>
<polyline points="760,1025 920,1025" fill="none" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="807" y="1012" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="14" fill="#334155">修改</text>
<polyline points="550,1075 550,1125" fill="none" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="565" y="1105" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="14" fill="#334155">确认</text>
<polyline points="770,1165 920,1165" fill="none" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="810" y="1152" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="14" fill="#334155">失败</text>
<polyline points="550,1205 550,1270" fill="none" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="565" y="1240" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="14" fill="#334155">成功</text>
<polyline points="330,1310 140,1310 140,330 330,330" fill="none" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="150" y="1290" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="14" fill="#334155">仅有待处理的变化事件时</text>
</svg>
