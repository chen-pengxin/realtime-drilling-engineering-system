limit_req_zone $binary_remote_addr zone=drilling_api:10m rate=20r/s;
limit_conn_zone $binary_remote_addr zone=drilling_conn:10m;

server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  client_max_body_size 2g;
  # Keep HTTP available for local development. Production should mount
  # nginx.tls.conf (or an equivalent site) and redirect port 80 to HTTPS.
  location / { try_files $uri $uri/ /index.html; }
  location /api/algorithm/ {
    # 统一经 RuoYi 网关鉴权、审计和项目权限过滤；开发环境如需直连可访问
    # algorithm-server:8000，但生产入口不绕过 Java。
    proxy_pass http://ruoyi-admin:80/api/algorithm/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    limit_req zone=drilling_api burst=40 nodelay;
    limit_conn drilling_conn 20;
    proxy_read_timeout 600s;
  }
  location /prod-api/ {
    proxy_pass http://ruoyi-admin:80/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    limit_req zone=drilling_api burst=40 nodelay;
    limit_conn drilling_conn 20;
    proxy_read_timeout 600s;
  }
}
